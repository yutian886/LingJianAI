name: Build LingJianAI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LingJianAI_Android_Starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

          mkdir -p /tmp/lingjian-starter

          unzip -q LingJianAI_Android_Starter.zip \
            -d /tmp/lingjian-starter

          PROJECT_DIR="$(dirname "$(find /tmp/lingjian-starter -type f -name settings.gradle.kts -print -quit)")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Cannot find settings.gradle.kts"
            exit 1
          fi

          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./

      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          s = p.read_text()

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          p.write_text(s)
          print("Java and Kotlin target settings updated where needed.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingJianAI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

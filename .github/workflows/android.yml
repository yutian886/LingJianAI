name: Build LingJianAI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LingJianAI_Android_Starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

          mkdir -p /tmp/lingjian-starter

          unzip -q LingJianAI_Android_Starter.zip -d /tmp/lingjian-starter

          PROJECT_DIR="$(dirname "$(find /tmp/lingjian-starter -type f -name settings.gradle.kts -print -quit)")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Cannot find settings.gradle.kts"
            exit 1
          fi

          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17
                  targetCompatibility = org.gradle.api.JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingJianAI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build LingJianAI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LingJianAI_Android_Starter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync
          mkdir -p /tmp/lingjian-starter
          unzip -q LingJianAI_Android_Starter.zip -d /tmp/lingjian-starter

          PROJECT_DIR="$(dirname "$(find /tmp/lingjian-starter -type f -name settings.gradle.kts -print -quit)")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Cannot find settings.gradle.kts"
            exit 1
          fi

          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingJianAI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
